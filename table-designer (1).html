<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เครื่องมือออกแบบตารางข้อมูล</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800&family=Sarabun:wght@400;700&family=Mitr:wght@400;600&family=Prompt:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f3f1ec;--pn:#fff;--tx:#1c1c1c;--mu:#6b6b6b;--ln:#ddd8cf;--ac:#e8590c;--ac2:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--pn:#1c1c1c;--tx:#f0f0f0;--mu:#a0a0a0;--ln:#333;--ac:#ffc400;--ac2:#111}}
:root[data-theme="dark"]{--bg:#121212;--pn:#1c1c1c;--tx:#f0f0f0;--mu:#a0a0a0;--ln:#333;--ac:#ffc400;--ac2:#111}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Sarabun','Kanit',system-ui,sans-serif;font-size:16px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding:20px 14px 60px;display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
@media(min-width:960px){.wrap{grid-template-columns:minmax(0,1fr) 600px;align-items:start}.out{position:sticky;top:16px}}
h1{font-family:'Kanit',sans-serif;font-size:26px;margin:0 0 4px}
.sub{color:var(--mu);margin:0 0 14px}
.lang{display:flex;gap:6px;justify-content:flex-end;margin-bottom:6px}
.lang button{padding:5px 12px;font-size:14px}
.lang button.on{background:var(--ac);color:var(--ac2);border-color:var(--ac);font-weight:700}
.panel{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:16px;margin-bottom:14px}
.panel h2{font-family:'Kanit',sans-serif;font-size:17px;margin:0 0 10px}
label{display:block;font-size:14px;color:var(--mu);margin:8px 0 4px}
input[type=text],select{width:100%;padding:9px 10px;border:1px solid var(--ln);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
button{font:inherit;cursor:pointer;border:1px solid var(--ln);background:var(--pn);color:var(--tx);padding:8px 14px;border-radius:6px}
button:hover{border-color:var(--ac)}
button.pri{background:var(--ac);color:var(--ac2);border-color:var(--ac);font-weight:700;padding:11px 22px;font-size:17px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.scroll{overflow-x:auto}
table.ed{border-collapse:collapse;min-width:100%}
.ed td,.ed th{padding:3px}
.ed input{min-width:120px;padding:7px 8px;border:1px solid var(--ln);border-radius:5px;background:var(--bg);color:var(--tx);font:inherit;width:100%}
.ed th input{font-weight:700}
.x{padding:2px 8px;color:var(--mu)}
.bgs{display:flex;gap:8px;flex-wrap:wrap}
.bgs button{width:54px;height:54px;padding:0;border-radius:8px;border:2px solid var(--ln)}
.bgs button.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}
.note{font-size:13px;color:var(--mu)}
.chk{display:flex;gap:8px;align-items:center;margin-top:10px;color:var(--tx);font-size:15px}
/* output card */
#card{--ov:rgba(0,0,0,.7);--cbg:transparent;--tc:#fff;--ti:#ffe600;--hb:transparent;--ht:#ccc;--ra:rgba(255,255,255,.06);--rb:rgba(255,255,255,.02);--ak:#ffe600;--ff:'Kanit',sans-serif;--rd:0px;
position:relative;width:100%;aspect-ratio:auto;min-height:420px;border-radius:12px;overflow:hidden;background-size:cover;background-position:center;font-family:var(--ff);color:var(--tc)}
#card .ov{position:absolute;inset:0;background:var(--ov)}
#card .in{position:relative;padding:26px 20px 18px}
#card h3{margin:0 0 12px;text-align:center;color:var(--ti);font-size:clamp(24px,5.4vw,36px);line-height:1.2;font-weight:800;text-wrap:balance}
#card table{width:100%;border-collapse:separate;border-spacing:0 3px;font-size:clamp(13px,2.7vw,17px)}
#card th{background:var(--hb);color:var(--ht);font-weight:400;padding:6px 10px;text-align:left}
#card td{padding:6px 10px;background:var(--rb);font-weight:600}
#card tr:nth-child(odd) td{background:var(--ra)}
#card td:first-child,#card th:first-child{border-radius:var(--rd) 0 0 var(--rd)}
#card td:last-child,#card th:last-child{border-radius:0 var(--rd) var(--rd) 0}
#card tr.top td{background:color-mix(in srgb,var(--ak) 28%,transparent)}
#card .n{text-align:right}
#card td.k{color:var(--ak);font-weight:800}
#card td.rk{color:var(--ak);font-weight:800;text-align:center;width:2.6em}
#card th.rk{text-align:center}
#card .src{margin-top:10px;font-size:12px;opacity:.75}
#card .empty{text-align:center;padding:60px 10px;opacity:.7}
</style>
</head>
<body>
<div class="wrap">
<main>
<div class="lang" role="group" aria-label="Language"><button type="button" id="lth">ไทย</button><button type="button" id="len">English</button></div>
<h1>เครื่องมือออกแบบตารางข้อมูล</h1>
<p class="sub">กรอกข้อมูลหรือแนบไฟล์ Excel แล้วเลือกสไตล์ที่ชอบ</p>

<section class="panel">
<h2>1. หัวข้อตาราง</h2>
<input type="text" id="title" placeholder="เช่น เปิด Top 20 ท้องถิ่น จัดเก็บรายได้เองมากที่สุด 2568">
<label for="src">ที่มาของข้อมูล (ไม่บังคับ)</label>
<input type="text" id="src" placeholder="เช่น กรมการปกครองส่วนท้องถิ่น">
</section>

<section class="panel">
<h2>2. ข้อมูล</h2>
<div class="scroll"><table class="ed" id="ed"></table></div>
<div class="row"><button id="addC">+ เพิ่มคอลัมน์</button><button id="addR">+ เพิ่มแถว</button><button id="clr">ล้างข้อมูล</button></div>
<label for="xl">หรือแนบไฟล์ Excel (.xlsx, .xls, .csv): แถวแรกคือหัวคอลัมน์</label>
<input type="file" id="xl" accept=".xlsx,.xls,.csv">
<div class="note" id="xlmsg"></div>
<div id="shw" hidden><label for="sh">เลือกชีทที่ต้องการใช้</label><select id="sh"></select></div>
<label class="chk"><input type="checkbox" id="rank" checked> แสดงคอลัมน์ลำดับอัตโนมัติ</label>
<label class="chk"><input type="checkbox" id="thou" checked> ใส่ตัวคั่นหลักพันในตัวเลข (เช่น 1,182.51)</label>
<label for="sc">เรียงข้อมูลตามคอลัมน์</label>
<div class="row" style="margin-top:0"><select id="sc" style="flex:1;min-width:160px"></select><select id="sd" aria-label="ทิศทางการเรียง" style="flex:1;min-width:160px"><option value="d">มากไปน้อย</option><option value="a">น้อยไปมาก</option></select></div>
</section>

<section class="panel">
<h2>3. รูปแบบตาราง (30 แบบ)</h2>
<select id="sty"></select>
<h2 style="margin-top:16px">4. พื้นหลัง</h2>
<div class="bgs" id="bgs"></div>
<label for="bgf">หรืออัพโหลดรูปพื้นหลังของคุณเอง</label>
<input type="file" id="bgf" accept="image/*">
</section>

<div class="row">
<button class="pri" id="go">ประมวลข้อมูล</button>
<button id="demo">ใส่ข้อมูลตัวอย่าง</button>
<button id="dl">ดาวน์โหลด PNG</button>
</div>
</main>

<aside class="out"><div id="card"><div class="ov"></div><div class="in"><div class="empty">กด “ประมวลข้อมูล” เพื่อดูตัวอย่างตาราง</div></div></div>
<p class="note">ปุ่ม “ดาวน์โหลด PNG” จะบันทึกตารางเป็นรูปกว้าง 1080 พิกเซล</p></aside>
</div>
